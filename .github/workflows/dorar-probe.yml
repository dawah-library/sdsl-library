name: فحص صيغة الدرر السنية
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tools/reports
          curl -s "https://dorar.net/dorar_api.json?skey=%D8%A5%D9%86%D9%85%D8%A7%20%D8%A7%D9%84%D8%A3%D8%B9%D9%85%D8%A7%D9%84%20%D8%A8%D8%A7%D9%84%D9%86%D9%8A%D8%A7%D8%AA" -A "dawahlibrary.org" | head -c 6000 > tools/reports/dorar-api.txt
          curl -sL "https://dorar.net/hadith/search?q=%D8%A5%D9%86%D9%85%D8%A7%20%D8%A7%D9%84%D8%A3%D8%B9%D9%85%D8%A7%D9%84%20%D8%A8%D8%A7%D9%84%D9%86%D9%8A%D8%A7%D8%AA" -A "Mozilla/5.0" | grep -o 'href="/hadith/sharh/[0-9]*"\|sharh[^"]\{0,60\}' | head -20 > tools/reports/dorar-site.txt || true
          s=$(grep -o '/hadith/sharh/[0-9]*' tools/reports/dorar-site.txt | head -1); [ -n "$s" ] && curl -sL "https://dorar.net$s" -A "Mozilla/5.0" | sed 's/<[^>]*>/ /g' | tr -s ' \n' | head -c 5000 > tools/reports/dorar-sharh.txt || true
          bash tools/git-save.sh "فحص صيغة الدرر السنية" tools/reports
