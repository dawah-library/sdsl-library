name: صوتيات المكتبة (تحويل النص إلى صوت)
# مجاني بالكامل: أصوات Edge العصبية العربية عبر edge-tts، والملفات الصوتية في «إصدارات» المستودع (خارج مساحة R2 والموقع)
# مُفعَّل بقرار المدير (٣١ أكتوبر): يعمل يوميًا تلقائيًا لكتب مكتبة الدعوة (الأقصر أولًا) ثم ما تختاره الإدارة من المكتبة العامة،
# بالنص المشكول المدقق متى توفر، ويعيد الصفحات التي تغيّر نصها أو تشكيلها.
on:
  schedule:
    - cron: "33 0 * * *"   # يوميًا
    - cron: "33 12 * * *"  # جولة ثانية
  push:
    paths: ["data/audio/_queue.json", "data/audio/_auto.json"]
  workflow_dispatch:
    inputs:
      books:
        description: "معرّفات كتب لتحويلها الآن (مفصولة بفواصل)"
        required: false
        default: ""
      refresh:
        description: "إعادة الصفحات التي تغيّر نصها (1 للتفعيل)"
        required: false
        default: "0"
      force:
        description: "معرّفات كتب يُعاد تسجيلها كاملة"
        required: false
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: tts
  cancel-in-progress: false
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: الأدوات
        run: |
          pip install -q "edge-tts>=7"
          which ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: التحويل إلى صوت
        env:
          GH_TOKEN: ${{ github.token }}
          TTS_COMMIT: "1"
          TTS_AUTO: ${{ github.event.inputs.books == '' && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          TTS_MAX_MIN: "320"
          TTS_ONLY: ${{ github.event.inputs.books }}
          TTS_FORCE: ${{ github.event.inputs.force }}
          TTS_REFRESH: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.refresh || '0' }}
        run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          python3 tools/tts.py
      - name: إشعار الإدارة
        if: always()
        run: |
          [ -s .tts-report.txt ] && python3 tools/notify.py "$(cat .tts-report.txt)" || true
