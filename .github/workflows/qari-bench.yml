name: قياس Qari-OCR (القارئ المجاني المفتوح)
on:
  workflow_dispatch:
    inputs:
      book:
        description: "معرّف كتاب مصور"
        required: true
        default: "p2d64fddf"
      first:
        required: true
        default: "5"
      last:
        required: true
        default: "8"
      bf16:
        description: "1 = bfloat16 (أبطأ على معالجات لا تدعمه)، 0 = float32"
        required: false
        default: "0"
      pixels:
        description: "أقصى عدد بكسلات للصورة (أقل = أسرع)"
        required: false
        default: "802816"
permissions:
  contents: write
  id-token: write
jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: qari-v3
      - name: التثبيت
        run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q "transformers>=4.49,<5" accelerate peft qwen-vl-utils pillow
      - name: القياس
        env:
          QARI_PIXELS: ${{ github.event.inputs.pixels }}
          QARI_BF16: ${{ github.event.inputs.bf16 }}
        run: |
          {
          echo "# قياس Qari-OCR — $(date -u +%F' '%H:%M) UTC"; echo; echo '```'
          nproc; free -g | head -2
          PDF=$(python3 -c "import importlib.util,sys;sys.argv=['x'];s=importlib.util.spec_from_file_location('o','tools/ocr-pdf.py');o=importlib.util.module_from_spec(s);s.loader.exec_module(o);print(o.local_pdf('${{ github.event.inputs.book }}') or '')" 2>&1 | tail -3)
          echo "PDF: $PDF"
          P=$(echo "$PDF" | tail -1)
          [ -f "$P" ] && python3 tools/qari.py "$P" ${{ github.event.inputs.first }} ${{ github.event.inputs.last }} 2>&1 | grep -v "Warning\|warn" | tail -150
          echo '```'
          } > tools/qari-bench-${{ github.event.inputs.bf16 }}.md 2>&1 || true
      - name: حفظ النتيجة
        if: always()
        run: |
          git config user.name "sdsl-bot"; git config user.email "sdsl-bot@users.noreply.github.com"
          git add tools/qari-bench-${{ github.event.inputs.bf16 }}.md && git commit -qm "قياس Qari-OCR" && for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done || true
