name: قصص القدوات للطلائع
# صياغة قصص الصحابة والصحابيات من كتب عبد الرحمن رأفت الباشا وسلاسل الشيخ مصطفى دياب لكل مرحلة عمرية (tools/tala-qasas-gen.py).
# تُحفظ مقترحة في data/tala-qasas-gen.json، ولا تظهر للأطفال حتى يعتمدها المدير من «قصص الأبطال ← المراجعة».
on:
  schedule:
    - cron: "37 9 * * *"   # يوميًا بعد تجدد الحصة: دفعة صغيرة حتى تكتمل الكتب
  workflow_dispatch:
    inputs:
      only:
        description: "معرّفات فصول بعينها (اختياري)"
        required: false
        default: ""
      max:
        description: "أقصى عدد قصص"
        required: false
        default: "12"
permissions:
  contents: write
  models: read
concurrency:
  group: tala-qasas
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" tala_qasas)
          echo "on=$on" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: صياغة القصص
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN || github.token }}
          TQ_ONLY: ${{ github.event.inputs.only }}
          TQ_MAX: ${{ github.event.inputs.max || '12' }}
          TQ_COMMIT: "1"
          TQ_MINUTES: "90"
          TJ_MODEL: "gemini-3.8-flash"
        run: python3 tools/tala-qasas-gen.py
