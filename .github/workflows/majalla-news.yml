name: الركن الإخباري للمجلة
on:
  schedule:
    - cron: "17 */3 * * *"   # كل ثلاث ساعات
  workflow_dispatch:
    inputs:
      dry: { description: "تجربة بلا حفظ (1) مع تقرير مفصل", required: false, default: "" }
permissions:
  contents: write
concurrency:
  group: majalla-news
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" majalla_news)
          echo "on=$on" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: جمع الأخبار
        id: news
        env:
          NEWS_DRY: ${{ github.event.inputs.dry }}
        run: |
          python3 tools/majalla-news.py
          git diff --quiet data/majalla.json || echo "snap=1" >> "$GITHUB_OUTPUT"
      # تغيّرت لقطة أخبار عدد حديث: يُعاد إخراج ملفات PDF للعدد
      - uses: actions/setup-node@v4
        if: steps.news.outputs.snap == '1'
        with: { node-version: 20 }
      - name: إعادة إخراج PDF
        if: steps.news.outputs.snap == '1'
        run: |
          npm install --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          MAJ_STRICT=0 node tools/majalla-pdf.js
      - name: الحفظ
        if: github.event.inputs.dry != '1'
        run: |
          bash tools/git-save.sh "الركن الإخباري - تحديث الأخبار" data/majalla-news.json data/majalla.json data/majalla/pdf
