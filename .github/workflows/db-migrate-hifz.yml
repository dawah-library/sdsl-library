name: ترحيل جداول الحفظ (Supabase)
# يطبّق ملفًا واحدًا محددًا (supabase/migrations/2026-11-27-hifz.sql) عند دمجه أو تعديله، أو يدويًا. الملف آمن للتكرار (if not exists / drop policy if exists). بتفويض المستخدم 27 نوفمبر ٢٠٢٦.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/2026-11-27-hifz.sql", ".github/workflows/db-migrate-hifz.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: db-migrate-hifz
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: التنفيذ
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          f="supabase/migrations/2026-11-27-hifz.sql"
          python3 -c "import json,sys; print(json.dumps({'query': 'commit;\nbegin read write;\nset local role postgres;\n' + open(sys.argv[1], encoding='utf-8').read() + '\ncommit;', 'read_only': False}))" "$f" > /tmp/q.json
          code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/nqxkkdexpodjjwfdkxoq/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          head -c 2000 /tmp/r.json; echo; echo "HTTP $code"; [ "$code" -lt 300 ]
