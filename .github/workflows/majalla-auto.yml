name: الإصدار الدوري لمجلة المكتبة
# يوميًّا: يفتح العدد القادم للمشاركات قبل موعده، ويُصدره في موعده (ما أضافه الفريق والمشاركون أولًا، ويُستكمل الباقي آليًّا من المكتبة)،
# ثم يخرج ملفات PDF وينشر الموقع. الجدول في data/majalla.json ← plan (يُضبط من «الإدارة ← المجلة»). tools/majalla-auto.py
on:
  schedule:
    - cron: "41 4 * * *"   # ٦:٤١ صباحًا بتوقيت القاهرة
  workflow_dispatch:
    inputs:
      dry: { description: "تجربة بلا حفظ (1)", required: false, default: "" }
permissions:
  contents: write
  id-token: write  # إشعار تليجرام
  actions: write   # تشغيل النشر على Cloudflare بعد صدور العدد (إيداعات المهام الآلية لا تشغّله وحدها)
concurrency:
  group: majalla-auto
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" majalla_auto)
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && on=true
          echo "on=$on" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: فتح العدد القادم أو إصداره
        id: m
        env:
          MAJ_DRY: ${{ github.event.inputs.dry }}
        run: |
          python3 tools/majalla-auto.py
          git diff --quiet data/majalla.json || echo "changed=1" >> "$GITHUB_OUTPUT"
          grep -q "صدر العدد" .maj-report.txt 2>/dev/null && echo "pub=1" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-node@v4
        if: steps.m.outputs.pub == '1'
        with: { node-version: 20 }
      - name: إخراج PDF للعدد
        if: steps.m.outputs.pub == '1'
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          MAJ_STRICT=0 node tools/majalla-pdf.js
      - name: الحفظ والنشر
        if: steps.m.outputs.changed == '1' && github.event.inputs.dry != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash tools/git-save.sh "مجلة المكتبة: الإصدار الدوري" data/majalla.json data/majalla/pdf
          gh workflow run cf-deploy.yml -R "${{ github.repository }}" --ref main || echo "تعذر تشغيل النشر"
      - name: إشعار تليجرام
        if: steps.m.outputs.changed == '1'
        continue-on-error: true
        run: |
          [ -s .maj-report.txt ] && python3 tools/notify.py "📰 <b>مجلة المكتبة</b>
          $(cat .maj-report.txt)" || true
