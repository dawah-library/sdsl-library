name: خطب الجمعة (الإعداد والتحقق والمتابعة)
# قسم «خطب الجمعة» (tools/khutab.py، docs/khutab.md):
# - طابور الإعداد (data/khutab/queue.json من لوحة الإدارة): بحث واسترجاع من مكتبة الدعوة أولًا ← ثلاثة نماذج ← تحقق ← مسودة لا تُنشر إلا باعتماد.
# - تعديل موضوع (data/khutab/t/**): إعادة التحقق العلمي والفهرسة.
# - المواد المرفوعة (materials.json): استخراج النص.
# - أسبوعيًّا: المتابعة (المواسم القادمة، والمواد الجديدة، والمقترحات، والمراجعة) ← watch.json. مفتاح الإيقاف: khutab.
on:
  push:
    branches: [main]
    paths: ["data/khutab/queue.json", "data/khutab/materials.json", "data/khutab/t/**", "data/khutab/cats.json"]
  schedule:
    - cron: "17 3 * * 6"
    - cron: "41 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "gen | verify | watch | all"
        required: false
        default: "all"
permissions:
  contents: write
  actions: write
concurrency:
  group: khutab
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" khutab)
          echo "on=$on" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: المواد المرفوعة
        run: |
          if grep -q '"file"' data/khutab/materials.json; then sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true; python3 tools/khutab.py materials; fi
      - name: الإعداد من الطابور
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          KH_MAX: "8"
          MODE: ${{ github.event.inputs.mode || 'all' }}
        run: |
          n=$(python3 -c 'import json; print(len(json.load(open("data/khutab/queue.json")).get("items", [])))')
          if [ "$n" != "0" ] && { [ "$MODE" = "all" ] || [ "$MODE" = "gen" ]; }; then python3 tools/khutab.py gen; fi
          # المشروع الكبير: تُستأنف الجولة تلقائيًّا ما دام الطابور غير فارغ وأنتجت هذه الجولة شيئًا (وإلا انتظرت الجدولة كل ٤ ساعات حتى تتجدد الحصة)
          read ok rest < /tmp/kh-gen-status 2>/dev/null || { ok=0; rest=0; }
          echo "again=$([ "${ok:-0}" -gt 0 ] && [ "${rest:-0}" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_ENV"
      - name: التحقق والفهرسة
        run: python3 tools/khutab.py verify
      - name: المتابعة
        run: python3 tools/khutab.py watch
      - name: الحفظ
        run: |
          bash tools/git-save.sh "خطب الجمعة: إعداد وتحقق وفهرسة" data/khutab
      - name: استئناف الإعداد
        if: ${{ env.again == '1' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run khutab.yml --ref main -f mode=gen
