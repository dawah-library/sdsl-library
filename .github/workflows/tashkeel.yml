name: تشكيل الكتب (تشكيل مدقق نحويًا ولغويًا)
# مجاني: Gemini للتشكيل، ومدقق مستقل (GPT-4.1 عبر GitHub Models أو Gemini Pro) للمراجعة؛ ولا يتغير حرف من نص الكتاب.
on:
  schedule:
    - cron: "10 21 * * *"   # بعد جولتي التدقيق النصي اليوميتين، بما بقي من الحصة المجانية
    - cron: "10 11 * * *"   # جولة ثانية (تتسع بتعدد المفاتيح)
  push:
    paths: ["data/tashkeel/_queue.json"]
  workflow_dispatch:
    inputs:
      books:
        description: "معرّفات كتب لتشكيلها الآن (مفصولة بفواصل)"
        required: false
        default: ""
      pages:
        description: "الحد الأقصى للصفحات في هذه الجولة"
        required: false
        default: "400"
permissions:
  contents: write
  id-token: write
concurrency:
  group: tashkeel
  cancel-in-progress: false
jobs:
  # مفتاح الإيقاف من «الإدارة ← الخدمات والمفاتيح» (data/switches.json). الإيقاف يشمل التشغيل اليدوي والآلي؛ وتعذر القراءة لا يوقف المهمة.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" tashkeel)
          echo "on=$on" >> "$GITHUB_OUTPUT"; echo "المفتاح tashkeel: $on"
  tashkeel:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: التشكيل
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          TK_ONLY: ${{ github.event.inputs.books }}
          TK_MAX_PAGES: ${{ github.event.inputs.pages || '1200' }}
          TK_MAX_MIN: "300"
        run: python3 tools/tashkeel.py
      - name: الحفظ
        if: always()
        run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add data/tashkeel
          git diff --cached --quiet && exit 0
          git commit -qm "تشكيل الكتب: جولة $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: إشعار الإدارة
        if: always()
        run: |
          [ -s .tk-report.txt ] && python3 tools/notify.py "$(cat .tk-report.txt)" || true
