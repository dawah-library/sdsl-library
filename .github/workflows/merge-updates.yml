name: دمج تحديثات المكتبة
on:
  push:
    paths: ["updates/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-data
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/merge-update.js
      - run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add -A data updates
          git diff --cached --quiet || git commit -m "دمج تحديثات المكتبة"
          git pull --rebase
          git push
