name: دمج تحديثات المكتبة
on:
  push:
    paths: ["updates/*.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: merge-updates
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/merge-update.js
      - run: |
          bash tools/git-save.sh "دمج تحديثات المكتبة" data updates
