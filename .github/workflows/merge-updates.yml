name: دمج تحديثات المكتبة
on:
  push:
    paths: ["updates/*.json"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: merge-updates
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/merge-update.js
      - run: |
          bash tools/git-save.sh "دمج تحديثات المكتبة" data updates
      - name: إشعار تليجرام
        if: success()
        run: |
          S="$(git log -1 --format='%an|%s')"; case "$S" in sdsl-bot*) python3 tools/notify.py "✅ <b>${{ github.workflow }}</b>: ${S#*|}";; *) echo "لا جديد";; esac
      - name: إشعار عند التعثر
        if: failure()
        run: |
          python3 tools/notify.py "⚠️ <b>تعثّر: ${{ github.workflow }}</b>"
