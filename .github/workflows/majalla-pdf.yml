name: مطبعة المجلة — تصدير PDF
# يُخرج كل عدد منشور PDF رقميًّا ونسخة للطباعة من majpress/ (نص حقيقي، خطوط مضمَّنة، روابط، فهرس داخلي)،
# ويفحص الصفحات الفارغة وتجاوز المحتوى والعناوين المنفصلة، ويحفظ الملفات في data/majalla/pdf/.
on:
  push:
    branches: [main]
    paths: ["data/majalla.json", "majpress/**", "tools/majalla-pdf.js"]
  workflow_dispatch:
    inputs:
      issue: { description: "معرّف العدد (فارغ = كل الأعداد المنشورة)", required: false, default: "" }
permissions:
  contents: write
concurrency:
  group: majalla-pdf
  cancel-in-progress: true
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: تحديث الأخبار ولقطة العدد
        run: python3 tools/majalla-news.py || true
      - name: الإخراج والفحص
        run: MAJ_STRICT=0 node tools/majalla-pdf.js ${{ github.event.inputs.issue }}
      - name: الحفظ
        run: |
          bash tools/git-save.sh "مطبعة المجلة: تحديث ملفات PDF" data/majalla/pdf data/majalla-news.json data/majalla.json
