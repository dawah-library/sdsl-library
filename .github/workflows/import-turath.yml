name: استيراد كتب التراث من OpenITI
on:
  workflow_dispatch:
    inputs:
      only:
        description: "معرّفات كتب بعينها مفصولة بفواصل (اتركه فارغًا لكل القائمة)"
        required: false
        default: ""
      replace:
        description: "اكتب 1 لإعادة استيراد الموجود (لتحديث بيانات الطبعات)"
        required: false
        default: ""
  push:
    paths: ["tools/turath-list.json", "data/retry.json"]
permissions:
  contents: write
  id-token: write
concurrency:
  group: import-turath
  cancel-in-progress: false
jobs:
  # مفتاح الإيقاف من «الإدارة ← الخدمات والمفاتيح» (data/switches.json). الإيقاف يشمل التشغيل اليدوي والآلي؛ وتعذر القراءة لا يوقف المهمة.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" import_turath)
          echo "on=$on" >> "$GITHUB_OUTPUT"; echo "المفتاح import_turath: $on"
  import:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: إعادة المحاولة من «تقارير الاستيراد» (data/retry.json)
        id: retry
        run: |
          only=""
          if [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD | grep -qx data/retry.json; then
            only=$(python3 -c 'import json;print(",".join((json.load(open("data/retry.json")).get("turath") or [])))')
          fi
          echo "only=$only" >> "$GITHUB_OUTPUT"; echo "إعادة المحاولة: ${only:-لا}"
      - name: الاستيراد
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ github.event.inputs.only || steps.retry.outputs.only }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: python3 tools/import-turath.py
      - name: الحفظ
        run: |
          python3 tools/enrich-log.py || true
          bash tools/git-save.sh "استيراد كتب التراث من OpenITI" data vols tools/turath-report.md tools/enrich-log.md
      - name: فهرس معاني الكلمات
        run: |
          python3 tools/gloss.py >/dev/null && bash tools/git-save.sh "فهرس معاني الكلمات بعد الاستيراد" data/gloss || true
      - name: إشعار تليجرام
        if: success()
        run: |
          S="$(git log -1 --format='%an|%s')"; case "$S" in sdsl-bot*) python3 tools/notify.py "✅ <b>${{ github.workflow }}</b>: ${S#*|}";; *) echo "لا جديد";; esac
      - name: إشعار عند التعثر
        if: failure()
        run: |
          python3 tools/notify.py "⚠️ <b>تعثّر: ${{ github.workflow }}</b>"
