name: استيراد كتب التراث من OpenITI
on:
  workflow_dispatch:
    inputs:
      only:
        description: "معرّفات كتب بعينها مفصولة بفواصل (اتركه فارغًا لكل القائمة)"
        required: false
        default: ""
      replace:
        description: "اكتب 1 لإعادة استيراد الموجود (لتحديث بيانات الطبعات)"
        required: false
        default: ""
  push:
    paths: ["tools/turath-list.json"]
permissions:
  contents: write
  id-token: write
concurrency:
  group: import-turath
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: الاستيراد
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ github.event.inputs.only }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: python3 tools/import-turath.py
      - name: الحفظ
        run: |
          bash tools/git-save.sh "استيراد كتب التراث من OpenITI" data vols tools/turath-report.md
      - name: إشعار تليجرام
        if: success()
        run: |
          S="$(git log -1 --format='%an|%s')"; case "$S" in sdsl-bot*) python3 tools/notify.py "✅ <b>${{ github.workflow }}</b>: ${S#*|}";; *) echo "لا جديد";; esac
      - name: إشعار عند التعثر
        if: failure()
        run: |
          python3 tools/notify.py "⚠️ <b>تعثّر: ${{ github.workflow }}</b>"
