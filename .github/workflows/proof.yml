name: تدقيق الكتب النصية (اقتراحات تصحيح)
on:
  workflow_dispatch:
  push:
    paths: ["data/proof/_queue.json"]
  schedule:
    - cron: "29 3 * * *"
permissions:
  contents: write
  id-token: write
concurrency:
  group: proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: التدقيق
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
        run: |
          python3 tools/proof.py
          # الكتب النصية المربوطة بمصورات طبعاتها: الصفحات التي خالفت صورتها تُقرأ مع الصورة (tools/scan-proof.py)
          sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils >/dev/null
          python3 tools/scan-proof.py || echo "::warning::تعذّر التدقيق على المصورة"
          # ما لم تراجعه الإدارة خلال ثلاثة أيام من التصحيحات الصغيرة الآمنة يُطبَّق تلقائيًّا بسجل (tools/proof-auto.py)
          python3 tools/proof-auto.py
      - run: |
          bash tools/git-save.sh "تدقيق الكتب النصية: اقتراحات تصحيح تنتظر الاعتماد" data/proof data/catalog.json data/books vols
