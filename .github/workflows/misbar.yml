name: المسبار - اختبارات أقسام الموسوعات
# tools/misbar.py: بنوك أسئلة «المِسبار» لكل قسم (ثلاثة مستويات) من مواضع مسائل مخطط الموسوعة؛ تعتمدها الإدارة من #/misbar.
# ينفّذ data/misbar/_queue.json فقط، والقسم بلا مخطط ينتظر. مفتاح الإيقاف: misbar.
on:
  push:
    branches: [main]
    paths: ["data/misbar/_queue.json"]
  schedule:
    - cron: "17 15 * * *"   # يكمل الطابور بعد تجدد الحصة
  workflow_dispatch:
    inputs:
      args: { description: "اختياري: <k> [n] (فارغ = الطابور)", required: false, default: "" }
permissions:
  contents: write
  models: read
concurrency:
  group: misbar
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" misbar)
          echo "on=$on" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: بناء الأسئلة
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          MAWSUA_MINUTES: "120"
        run: |
          if [ ! -s data/misbar/_queue.json ] || [ "$(python3 -c 'import json;print(len(json.load(open("data/misbar/_queue.json")).get("items",[])))')" = "0" ]; then
            [ -z "${{ github.event.inputs.args }}" ] && { echo "الطابور فارغ"; exit 0; }
          fi
          python3 tools/misbar.py ${{ github.event.inputs.args }}
      - name: الحفظ
        if: always()
        run: |
          bash tools/git-save.sh "المسبار - بنوك الأسئلة" data/misbar
