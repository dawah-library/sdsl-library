name: الموسوعات العلمية المتخصصة
# tools/mawsua.py: مخطط كل موسوعة (أبواب ← فصول ← مسائل) وتحرير مسائلها من كتب مشايخ الدعوة ومقالاتهم وفتاواهم مع التكميل من المراجع،
# بعزو كل فقرة إلى موضعها؛ وكل مادة مسودة حتى تعتمدها الإدارة من #/mawsua. ينفّذ ما تضعه الإدارة في data/mawsua/_queue.json فقط.
# يوميًّا: grow (النمو بالجديد من مصادر مشايخ الدعوة، واستكمال المخططات والمسائل) ثم الطابور. مفتاح الإيقاف: mawsua.
on:
  push:
    branches: [main]
    paths: ["data/mawsua/_queue.json"]
  schedule:
    - cron: "47 12 * * *"   # يكمل الطابور بعد تجدد الحصة
    - cron: "47 21 * * *"   # جولة ثانية لما بقي من الحصة (تتوقف فورًا إن نفدت)
  workflow_dispatch:
    inputs:
      args: { description: "اختياري: plan [k] | build <k> [n] (فارغ = الطابور)", required: false, default: "" }
permissions:
  contents: write
  id-token: write   # إشعار تليجرام بما حُرِّر
  models: read
  actions: write   # تشغيل النشر على Cloudflare بعد الجولة (إيداعات المهام الآلية لا تشغّله وحدها)
concurrency:
  group: mawsua
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" mawsua)
          echo "on=$on" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: التحرير
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          MAWSUA_MINUTES: "170"
        run: |
          # النمو التلقائي أولًا: الجديد من كتب مشايخ الدعوة ومقالاتهم وشروحهم يُطابَق بالمسائل، وما بقي من المخططات والمسائل يُطلب
          [ -z "${{ github.event.inputs.args }}" ] && python3 tools/mawsua.py grow
          python3 tools/mawsua.py ${{ github.event.inputs.args }}
      - name: إشعار بما حُرِّر
        if: always()
        run: python3 tools/notify-new.py mawsua || true
      - name: الحفظ
        if: always()
        run: |
          before=$(git rev-parse HEAD)
          bash tools/git-save.sh "الموسوعات العلمية - جولة تحرير" data/mawsua
          # النشر التلقائي (طلب المدير، ٢١ نوفمبر): ما حُرِّر أو دُعِّم يظهر في الموقع فور الجولة
          if [ "$(git rev-parse HEAD)" != "$before" ]; then gh workflow run cf-deploy.yml -R "${{ github.repository }}" --ref main || echo "تعذر تشغيل النشر"; fi
        env:
          GH_TOKEN: ${{ github.token }}
