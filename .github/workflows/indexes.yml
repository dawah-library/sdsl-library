name: الفهارس الفنية (الآيات والأحاديث والأعلام)
# يعيد بناء فهارس الكتب التي تغيّر نصها فقط. يعمل عند تعديل النصوص، ويوميًا لالتقاط ما حفظته المهام الآلية.
on:
  push:
    branches: [main]
    paths: ["data/books/**", "vols/**", "tools/indexes.py"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: indexes
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/indexes.py
      - run: bash tools/git-save.sh "تحديث الفهارس الفنية" data/idx
      - name: إشعار عند التعثر
        if: failure()
        run: |
          python3 tools/notify.py "⚠️ <b>تعثّر: ${{ github.workflow }}</b>"
