name: انتقاء منشورات المشايخ وتدقيق سؤال وجواب
on:
  schedule:
    - cron: "40 19 * * *"   # يوميًا بالحصة المجانية المتبقية
    - cron: "40 9 * * *"    # جولة ثانية (تعدد المفاتيح)
  workflow_dispatch:
    inputs:
      mode:
        description: "fawaid أو qa أو all"
        required: false
        default: "all"
      max:
        description: "حد طلبات الذكاء الاصطناعي"
        required: false
        default: "80"
permissions:
  contents: write
  id-token: write
concurrency:
  group: curate
  cancel-in-progress: false
jobs:
  # مفتاح الإيقاف من «الإدارة ← الخدمات والمفاتيح» (data/switches.json). الإيقاف يشمل التشغيل اليدوي والآلي؛ وتعذر القراءة لا يوقف المهمة.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" curate)
          echo "on=$on" >> "$GITHUB_OUTPUT"; echo "المفتاح curate: $on"
  run:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: استخراج سؤال وجواب من النصوص
        run: python3 tools/qa.py
      - name: الانتقاء والتدقيق
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          CUR_MODE: ${{ github.event.inputs.mode || 'all' }}
          CUR_MAX: ${{ github.event.inputs.max || '450' }}
          CUR_MINUTES: "200"
        run: python3 tools/curate.py
      - name: دمج الأسئلة الجديدة في القسم
        run: python3 tools/qa.py
      - name: الحفظ
        if: always()
        run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add data/qa data/fawaid.json 2>/dev/null
          git diff --cached --quiet && exit 0
          git commit -qm "انتقاء المنشورات وتدقيق سؤال وجواب"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: إشعار
        if: always()
        run: '[ -s .cur-report.txt ] && python3 tools/notify.py "$(cat .cur-report.txt)" || true'
