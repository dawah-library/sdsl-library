name: تطبيق ترحيل قاعدة البيانات (Supabase)
# يدوي فقط، وبإذن المدير: ينفّذ ملف SQL من supabase/migrations على مشروع Supabase عبر واجهة الإدارة (SUPABASE_ACCESS_TOKEN).
# الملفات آمنة قابلة للتكرار (if exists / or replace)، ويُكتب الناتج في سجل التشغيل.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "ملف الترحيل داخل supabase/migrations"
        required: true
        default: "2026-11-13-roles-audio-groups.sql"
permissions:
  contents: read
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: التنفيذ
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: ${{ github.event.inputs.file }}
        run: |
          set -e
          case "$FILE" in */*|*..*) echo "اسم ملف غير صالح"; exit 1;; esac
          f="supabase/migrations/$FILE"; [ -f "$f" ] || { echo "غير موجود: $f"; exit 1; }
          python3 -c "import json,sys; print(json.dumps({'query': open(sys.argv[1], encoding='utf-8').read()}))" "$f" > /tmp/q.json
          code=$(curl -sS -o /tmp/r.json -w "%{http_code}" -X POST "https://api.supabase.com/v1/projects/nqxkkdexpodjjwfdkxoq/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          head -c 2000 /tmp/r.json; echo; echo "HTTP $code"; [ "$code" -lt 300 ]
