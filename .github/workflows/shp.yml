name: شرح الكتب والمتون (المطابقة)
# يربط مقاطع الشرح بمواضعها من الأصل (tools/sharh-align.py) لكل مشروع في data/shp/_queue.json، ويستكمل المجلدات الجديدة دون إعادة ما عولج.
# مجاني: تضمينات Gemini وترجيح المواضع المترددة فقط (SHP_MAXLLM في الجولة). مفتاح الإيقاف: sharh_projects.
on:
  push:
    branches: [main]
    paths: ["data/shp/_queue.json"]
  workflow_dispatch:
    inputs:
      only:
        description: "معرّف مشروع بعينه (اختياري)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: shp
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" sharh_projects)
          echo "on=$on" >> "$GITHUB_OUTPUT"
  align:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: المطابقة
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          ids="$ONLY"; [ -z "$ids" ] && ids=$(python3 -c 'import json; print(" ".join(json.load(open("data/shp/_queue.json")).get("items", [])))' 2>/dev/null)
          [ -z "$ids" ] && { echo "لا مشاريع في الطابور"; exit 0; }
          python3 tools/sharh-align.py $ids
          python3 -c 'import json; json.dump({"items": []}, open("data/shp/_queue.json", "w"))'
      - run: |
          bash tools/git-save.sh "شرح الكتب: مطابقة الشروح بمواضعها" data/shp
