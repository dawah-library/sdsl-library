name: النشر على Cloudflare Pages
# ينشر الموقع على Cloudflare Pages (مجاني) مع كل تحديث للفرع الرئيسي، برفع الملفات المتغيرة فقط.
# التشغيل اليدوي مع «setup» يهيئ المشروع أول مرة: ينشئه، وينقل المفاتيح السرية من أسرار GitHub
# (ومفتاح Supabase السري عبر SUPABASE_ACCESS_TOKEN)، ثم يربط النطاق dawahlibrary.org بعد نجاح الفحص.
# يحتاج سرًّا واحدًا في GitHub: CLOUDFLARE_API_TOKEN (صلاحيات: Pages Edit، وDNS Edit وZone Read للنطاق).
on:
  push:
    branches: [main]
    paths-ignore: ["data/audio/**", "data/tashkeel/**", "data/switches.json", "data/admin-log.json", "tools/**", "*.md", ".github/**"]
  workflow_dispatch:
    inputs:
      setup: { description: "تهيئة المشروع والمفاتيح", type: boolean, default: false }
      domain: { description: "ربط النطاق dawahlibrary.org بعد نجاح الفحص", type: boolean, default: false }
concurrency: { group: cf-deploy, cancel-in-progress: true }
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: e54869c38d968d8f54d1a011d6cacca4
  P: sdsl-library
  CF: https://api.cloudflare.com/client/v4
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: التحقق من مفتاح Cloudflare
        id: tok
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::لم يُضف السر CLOUDFLARE_API_TOKEN في GitHub بعد؛ لا نشر."; echo "ok=0" >> $GITHUB_OUTPUT; exit 0; fi
          r=$(curl -s "$CF/user/tokens/verify" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result.status // .errors[0].message')
          echo "::notice::token: $r"; [ "$r" = active ] && echo "ok=1" >> $GITHUB_OUTPUT || echo "ok=0" >> $GITHUB_OUTPUT
      - if: steps.tok.outputs.ok == '1'
        uses: actions/checkout@v4
      - if: steps.tok.outputs.ok == '1'
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: steps.tok.outputs.ok == '1'
        run: npm install --no-audit --no-fund && npm install --no-save wrangler@4 && python3 tools/cf-config.py
      - name: إنشاء المشروع (أول مرة)
        if: steps.tok.outputs.ok == '1'
        run: |
          code=$(curl -s -o /tmp/p -w "%{http_code}" "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$P" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [ "$code" != 200 ]; then npx wrangler pages project create "$P" --production-branch main 2>&1 | tail -3 | sed 's/^/::notice::/'; fi
      - name: المفاتيح السرية
        if: steps.tok.outputs.ok == '1' && inputs.setup
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITHUB_WRITE_TOKEN: ${{ secrets.GH_WRITE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            SUPABASE_SECRET_KEY=$(curl -s "https://api.supabase.com/v1/projects/nqxkkdexpodjjwfdkxoq/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '([.[]|select(.type=="secret")][0].api_key) // ([.[]|select(.name=="service_role")][0].api_key) // empty')
            [ -n "$SUPABASE_SECRET_KEY" ] && echo "::add-mask::$SUPABASE_SECRET_KEY"; export SUPABASE_SECRET_KEY
          fi
          for n in GEMINI_API_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY GITHUB_WRITE_TOKEN RESEND_API_KEY SUPABASE_SECRET_KEY; do
            v="${!n}"
            if [ -z "$v" ]; then echo "::warning::$n غير متوفر في أسرار GitHub — لم يُنقل"; continue; fi
            printf %s "$v" | npx wrangler pages secret put "$n" --project-name "$P" >/dev/null 2>&1 && echo "::notice::$n ✓" || echo "::warning::$n فشل"
          done
      - name: النشر
        if: steps.tok.outputs.ok == '1'
        id: dep
        run: |
          npx wrangler pages deploy . --project-name "$P" --branch main --commit-dirty=true > /tmp/d.log 2>&1 || { tail -20 /tmp/d.log | sed 's/^/::error::/'; exit 1; }
          sub=$(curl -s "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$P" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r .result.subdomain)
          echo "::notice::https://$sub"; echo "sub=$sub" >> $GITHUB_OUTPUT
      - name: فحص الموقع المنشور
        if: steps.tok.outputs.ok == '1'
        run: |
          B="https://${{ steps.dep.outputs.sub }}"; fail=0; sleep 15
          chk(){ c=$(curl -s -o /tmp/b -w "%{http_code}" "$B$1"); echo "::notice::$1 → $c $(grep -o '<title>[^<]*' /tmp/b | head -1)"; [ "$c" = "$2" ] || fail=1; }
          chk / 200; chk /book/umdafiqh/3 200; chk /book/sv2562 200; chk /author/w53 200; chk /app.js 200; chk /data/catalog.json 200; chk /sitemap.xml 200; chk /api/pages?check=1 200
          [ $fail = 0 ]
      - name: ربط النطاق
        if: steps.tok.outputs.ok == '1' && inputs.domain
        run: |
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"; sub="${{ steps.dep.outputs.sub }}"
          for d in dawahlibrary.org www.dawahlibrary.org; do
            curl -s -X POST "$CF/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$P/domains" -H "$H" -H "content-type: application/json" -d "{\"name\":\"$d\"}" | jq -r '"::notice::domain '"$d"': " + (if .success then "added" else (.errors[0].message // "?") end)'
          done
          z=$(curl -s "$CF/zones?name=dawahlibrary.org" -H "$H" | jq -r '.result[0].id // empty')
          if [ -z "$z" ]; then echo "::warning::النطاق ليس مُدارًا في Cloudflare: أضف عند مسجّل النطاق سجل CNAME للاسمين @ وwww إلى $sub"; exit 0; fi
          for d in dawahlibrary.org www.dawahlibrary.org; do
            ids=$(curl -s "$CF/zones/$z/dns_records?name=$d" -H "$H" | jq -r '.result[]|select(.type=="A" or .type=="AAAA" or .type=="CNAME")|.id')
            body="{\"type\":\"CNAME\",\"name\":\"$d\",\"content\":\"$sub\",\"proxied\":true,\"comment\":\"Cloudflare Pages (كان Vercel)\"}"
            first=$(echo "$ids" | head -1)
            if [ -n "$first" ]; then curl -s -X PUT "$CF/zones/$z/dns_records/$first" -H "$H" -H "content-type: application/json" -d "$body" | jq -r '"::notice::dns '"$d"' updated: \(.success)"'
            else curl -s -X POST "$CF/zones/$z/dns_records" -H "$H" -H "content-type: application/json" -d "$body" | jq -r '"::notice::dns '"$d"' created: \(.success)"'; fi
            n=$(echo "$ids" | sed '/^$/d' | wc -l); [ "$n" -gt 1 ] && echo "::warning::$d عليه $((n-1)) سجل إضافي قديم لم يُحذف (يحتاج إذن الحذف)"
          done
