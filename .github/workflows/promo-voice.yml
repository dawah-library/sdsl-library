name: التعليق الصوتي الاحترافي للفيديو التعريفي (تجربة أداء وتحكيم)
on:
  push:
    paths: ["promo/script2.json", "promo/script3.json", "promo/voice2.py"]
  workflow_dispatch:
    inputs:
      voice:
        description: "فرض صوت بعينه (اختياري)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: promo-voice
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: الأدوات
        run: which ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: التسجيل
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
          PROMO_VOICE: ${{ github.event.inputs.voice }}
        run: python3 promo/voice2.py script3.json
      - name: الحفظ
        run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add promo/voice
          git diff --cached --quiet && exit 0
          git commit -m "التعليق الصوتي للفيديو التعريفي"
          for i in 1 2 3 4; do git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep $((i*3)); done
