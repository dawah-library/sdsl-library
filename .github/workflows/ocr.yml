name: تحويل الكتب المصورة إلى نص
on:
  push:
    paths: ["ocr-inbox/*.pdf", "ocr-inbox/*.PDF"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: library-data
  cancel-in-progress: false
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: تثبيت أدوات التعرف الضوئي
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
          mkdir -p tessdata && curl -sSL -o tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata
      - name: التحويل
        run: TESSDATA_PREFIX=$PWD/tessdata python3 tools/ocr-pdf.py
      - run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add -A data pdf ocr-inbox
          git diff --cached --quiet || git commit -m "تحويل كتب مصورة إلى نص"
          git pull --rebase
          git push
