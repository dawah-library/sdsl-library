name: تحويل الكتب المصورة إلى نص
# ثلاث مراحل: ١) تقسيم صفحات الكتب على أجهزة متوازية ٢) كل جهاز يعدّ مسودات Tesseract وSurya لنصيبه
# ٣) جهاز أخير يجمع المسودات ويراجعها Gemini على الصور، ثم مدقق ثانٍ أقوى لمواضع الشك، ويحفظ الكتاب.
on:
  push:
    paths: ["ocr-inbox/*.pdf", "ocr-inbox/*.PDF", "ocr-inbox/*.redo", "ocr-inbox/*.ready"]
  schedule:
    - cron: "20 7 * * *"   # التدقيق الدوري بعد تجدد حصة Gemini اليومية: الصفحات التي فاتتها المراجعة ثم الخفيفة ثم المشكوك فيها
    - cron: "40 16 * * *"  # جولة ثانية لما بقي
  workflow_dispatch:
    inputs:
      rereview:
        description: "إكمال مراجعة الصفحات التي فاتتها في الكتب المحفوظة (1 للتفعيل)"
        required: false
        default: "1"
      reocr:
        description: "معرّفات كتب موجودة لإعادة تحويلها من نسخها المصورة (مفصولة بفواصل)"
        required: false
        default: ""
permissions:
  contents: write
  id-token: write
env:
  OMP_THREAD_LIMIT: "1"  # بدونه تتزاحم خيوط Tesseract فيبطئ عشرات المرات
concurrency:
  group: ocr
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      any: ${{ steps.p.outputs.any }}
      books: ${{ steps.p.outputs.books }}
      nbooks: ${{ steps.p.outputs.nbooks }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - id: p
        env:
          REOCR: ${{ github.event.inputs.reocr }}
          OCR_MACHINES: ${{ vars.OCR_MACHINES || '16' }}
          OCR_SHARD: ${{ vars.OCR_SHARD || '12' }}
          OCR_TESS: ${{ vars.OCR_TESS || '0' }}
          OCR_REREVIEW: ${{ (github.event_name == 'schedule' || github.event.inputs.rereview == '1') && '1' || '0' }}
        run: |
          python3 tools/ocr-pdf.py --plan
          N=$(grep -oP '^nbooks=\K\d+' "$GITHUB_OUTPUT" | tail -1); [ "${N:-0}" -gt 0 ] && python3 tools/notify.py "⏳ <b>بدأ التحويل</b>: ${N} كتاب" || true

  drafts:
    needs: plan
    if: ${{ needs.plan.outputs.any == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: تثبيت Tesseract
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
          mkdir -p tessdata && curl -sSL -o tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/ara.traineddata
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: ذاكرة نماذج Surya
        if: ${{ vars.OCR_SURYA == '1' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/datalab
          key: surya-models-v1
      - name: تثبيت Surya
        if: ${{ vars.OCR_SURYA == '1' }}
        continue-on-error: true
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q surya-ocr
          surya_ocr --help > /dev/null && echo "Surya جاهز"
      - name: مسودات الصفحات ${{ matrix.shard.first }}-${{ matrix.shard.last }}
        env:
          OCR_SURYA: ${{ vars.OCR_SURYA || '0' }}
          RECOGNITION_BATCH_SIZE: "16"
          DETECTOR_BATCH_SIZE: "2"
        run: TESSDATA_PREFIX=$PWD/tessdata python3 tools/ocr-pdf.py --drafts "${{ matrix.shard.path }}" ${{ matrix.shard.first }} ${{ matrix.shard.last }}
      - uses: actions/upload-artifact@v4
        with:
          name: drafts-${{ strategy.job-index }}
          path: drafts/
          retention-days: 3

  # المراجعة: جهاز لكل كتاب، حتى ثلاثة كتب معًا (مفتاح Gemini لكل جهاز)
  review:
    needs: [plan, drafts]
    if: ${{ !cancelled() && needs.plan.outputs.nbooks != '0' && needs.plan.outputs.nbooks != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        book: ${{ fromJSON(needs.plan.outputs.books) }}
    steps:
      - uses: actions/checkout@v4
      - name: تثبيت الأدوات
        run: |
          which pdftoppm || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: drafts-*
          path: ocr-drafts
      - name: المراجعة والحفظ
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          REOCR: ${{ github.event.inputs.reocr }}
          OCR_SURYA: ${{ vars.OCR_SURYA || '0' }}
          OCR_DRAFTS: ocr-drafts
          OCR_PRO_MAX: ${{ vars.OCR_PRO_MAX || '60' }}
          OCR_ONLY: ${{ matrix.book }}
          OCR_NBOOKS: ${{ needs.plan.outputs.nbooks }}
          GEMINI_KEY_START: ${{ strategy.job-index }}
        run: TESSDATA_PREFIX=$PWD/tessdata python3 tools/ocr-pdf.py
      - name: رفع المصورة وصور الصفحات إلى مخزن R2 (إن ضُبط)
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          pip install -q --break-system-packages pillow; if [ -n "$R2_ACCESS_KEY_ID" ]; then pip install -q --break-system-packages boto3; fi; python3 tools/r2-store.py
      - run: |
          rm -rf ocr-drafts tessdata
          # النسخ المصورة لا تُحفظ في المستودع العام إلا احتياطًا إن تعذر رفعها إلى مخزن R2 الخاص
          KEEP=$(python3 -c "import json,os;c=json.load(open('data/catalog.json'));ids={b['id'] for b in c['books'] if b.get('img')!='r2'};print(' '.join('pdf/'+f for f in os.listdir('pdf') if f.endswith('.pdf') and f[:-4] in ids) if os.path.isdir('pdf') else '')")
          bash tools/git-save.sh "تحويل كتب مصورة إلى نص" data ocr-inbox tools/ocr-report.md $KEEP
      - name: إشعار تليجرام
        if: success()
        run: python3 tools/notify.py --file tools/ocr-report.md "✅ اكتمل التحويل"
      - name: إشعار عند التعثر
        if: failure()
        run: |
          python3 tools/notify.py "⚠️ <b>تعثّر التحويل</b>: ${{ matrix.book }}"
