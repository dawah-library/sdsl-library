name: نسخة احتياطية أسبوعية لقاعدة البيانات
# جداول Supabase (المخطط العام) إلى مخزن R2 الخاص: backups/db/<التاريخ>.json.gz (tools/db-backup.py). قراءة فقط.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 1 * * 5"   # كل جمعة
permissions:
  contents: write
  id-token: write
concurrency:
  group: db-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: النسخ والرفع
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            SUPABASE_SECRET_KEY=$(curl -s "https://api.supabase.com/v1/projects/nqxkkdexpodjjwfdkxoq/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r 'if type=="array" then (([.[]|select(.type=="secret")][0].api_key) // ([.[]|select(.name=="service_role")][0].api_key) // empty) else empty end' 2>/dev/null || true)
            if [ -n "$SUPABASE_SECRET_KEY" ]; then echo "::add-mask::$SUPABASE_SECRET_KEY"; fi
          fi
          export SUPABASE_SECRET_KEY
          python3 tools/db-backup.py
      - run: bash tools/git-save.sh "سجل النسخة الاحتياطية لقاعدة البيانات" data/db-backups.json
      - name: إشعار عند التعثر
        if: failure()
        run: |
          python3 tools/notify.py "⚠️ <b>تعثّر: ${{ github.workflow }}</b>"
