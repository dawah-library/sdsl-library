name: استكشاف مصادر الكتب النصية
# تراث والشاملة وجامع الكتب الإسلامية: بنية المواقع وواجهاتها (tools/books-probe.js) لبناء أدوات الاستيراد.
on:
  workflow_dispatch:
  push:
    branches: [main]  # فرع وكيل لا يشغّل مهام الحفظ (كانت تدفع إيداعات الفرع إلى main)
    paths: ["tools/books-probe.js", "tools/books-probe2.js", "tools/books-probe3.js", "tools/books-probe4.js", "tools/books-probe5.js"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          ch="$(git diff --name-only HEAD~1)"
          if [ "${{ github.event_name }}" = "push" ] && echo "$ch" | grep -q books-probe5; then node tools/books-probe5.js
          elif [ "${{ github.event_name }}" = "push" ] && echo "$ch" | grep -q books-probe4; then SITE=https://malakat.io OUTN=malakat node tools/books-probe4.js; SITE=https://miqyas.io OUTN=miqyas node tools/books-probe4.js
          elif [ "${{ github.event_name }}" = "push" ] && echo "$ch" | grep -q books-probe3; then node tools/books-probe3.js
          elif [ "${{ github.event_name }}" = "push" ] && echo "$ch" | grep -q books-probe2; then node tools/books-probe2.js
          else node tools/books-probe.js; node tools/books-probe2.js; node tools/books-probe3.js; fi
      - run: |
          bash tools/git-save.sh "استكشاف مصادر الكتب النصية - تقرير" tools/books-probe
