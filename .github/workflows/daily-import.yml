name: الاستيراد اليومي لمقالات صوت السلف
on:
  schedule:
    - cron: "17 2 * * *"   # يوميًا
    - cron: "47 13 * * *"  # جولة ثانية
  workflow_dispatch:
    inputs:
      count:
        description: "عدد المقالات في هذه الدفعة"
        default: "150"
permissions:
  contents: write
  id-token: write
concurrency:
  group: daily-import
  cancel-in-progress: false
jobs:
  # مفتاح الإيقاف من «الإدارة ← الخدمات والمفاتيح» (data/switches.json). الإيقاف يشمل التشغيل اليدوي والآلي؛ وتعذر القراءة لا يوقف المهمة.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" import_salafvoice)
          echo "on=$on" >> "$GITHUB_OUTPUT"; echo "المفتاح import_salafvoice: $on"
  import:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/daily-import.js ${{ github.event.inputs.count }}
      - run: |
          bash tools/git-save.sh "استيراد مقالات صوت السلف" data tools/samples
      - name: إشعار تليجرام
        if: success()
        run: |
          S="$(git log -1 --format='%an|%s')"; case "$S" in sdsl-bot*) python3 tools/notify.py "✅ <b>${{ github.workflow }}</b>: ${S#*|}";; *) echo "لا جديد";; esac
      - name: إشعار عند التعثر
        if: failure()
        run: |
          python3 tools/notify.py "⚠️ <b>تعثّر: ${{ github.workflow }}</b>"
