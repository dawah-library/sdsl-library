name: فحص الاستضافة على Cloudflare
# يبني دوال Cloudflare Pages ويشغّل الموقع محليًا بمحرك Cloudflare (workerd) ويفحص صفحات وخدمات أساسية.
on:
  push:
    paths: ["functions/**", "api/**", "lib/**", "wrangler.toml", "_routes.json", "_headers", "tools/cf-config.py", ".github/workflows/cf-check.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm install --no-save wrangler@4
      - run: python3 tools/cf-config.py && git diff --exit-code _headers _routes.json
      - run: npx wrangler pages functions build --outdir /tmp/fb
      - name: تشغيل وفحص
        run: |
          npx wrangler pages dev . --port 8788 --ip 127.0.0.1 > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8788/ && break; sleep 2; done
          fail=0
          chk(){ code=$(curl -s -o /tmp/b -w "%{http_code}" "http://127.0.0.1:8788$1" "${@:3}"); t=$(grep -o '<title>[^<]*' /tmp/b | head -1); echo "$1 → $code $t $(head -c 120 /tmp/b | tr -d '\n' | grep -v '<!' )"; [ "$code" = "$2" ] || fail=1; }
          chk / 200
          chk /book/umdafiqh/3 200
          chk /book/sv2562 200
          chk /author/w53 200
          chk "/library?c=turath&t=t4" 200
          chk /app.js 200
          chk /data/catalog.json 200
          chk /sitemap.xml 200
          chk /robots.txt 200
          chk /wp-login.php 404
          chk /book/umda/2 302
          chk /api/ask 503 -X POST -H 'content-type: application/json' -d '{}'
          chk /api/gh 503 -X POST -H 'content-type: application/json' -d '{}'
          chk /api/pages?check=1 503
          chk /api/nope 404
          grep -q "الهجر" <(curl -s http://127.0.0.1:8788/book/sv2562) || { echo "article SSR missing"; fail=1; }
          [ $fail = 0 ] || { tail -60 /tmp/dev.log; exit 1; }
