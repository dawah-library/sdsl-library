name: موسوعة آثار السلف
# يراجع مرشحات الآثار (tools/athar/cand.json) بنموذج Groq المجاني ويطابق لفظ كل أثر بمصدره، ثم ينشر المتحقق منه في data/athar.
# التشغيل اليدوي مع rebuild=1 يعيد استخراج المرشحات من الكتب (بعد إضافة مصادر جديدة). مفتاح الإيقاف: athar.
on:
  push:
    branches: [main]
    paths: ["data/athar/_review.json", "tools/athar/import/**"]   # قرار الإدارة أو مصدر خارجي جديد: يُعاد النشر
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
    inputs:
      rebuild: { description: "إعادة استخراج المرشحات من الكتب (1)", required: false, default: "0" }
      max: { description: "حد المرشحات في الجولة", required: false, default: "2000" }
permissions:
  contents: write
concurrency:
  group: athar
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" athar)
          echo "on=$on" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: استخراج المرشحات
        if: ${{ github.event.inputs.rebuild == '1' || github.event_name == 'push' }}
        run: python3 tools/athar.py
      - name: المراجعة والنشر
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ATHAR_MAX: ${{ github.event.inputs.max || '2000' }}
          ATHAR_MINUTES: "160"
        if: ${{ github.event_name != 'push' }}
        run: |
          python3 tools/athar-ai.py
          # المرحلة ٨: مراجعة تبويب المنشور سابقًا بالفهم السياقي (اقتراحات تعتمدها الإدارة في #/athar/review)
          ATHAR_MAX=400 ATHAR_MINUTES=40 python3 tools/athar-ai.py --refit || true
      - name: الحفظ
        if: always()
        run: |
          bash tools/git-save.sh "موسوعة آثار السلف - مراجعة جولة" tools/athar data/athar
