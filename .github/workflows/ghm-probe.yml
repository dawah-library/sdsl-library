name: فحص تشخيصي مؤقت لـ GitHub Models
on:
  push:
    branches: ["claude/**"]
    paths: ["tools/ghm-probe.py", ".github/workflows/ghm-probe.yml"]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN || github.token }}
        run: python3 tools/ghm-probe.py
