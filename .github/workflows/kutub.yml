name: كتب السنة في قسم الحديث
on:
  workflow_dispatch:
  push:
    paths: ["tools/kutub.py", "tools/hadith-topics.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/kutub.py && python3 tools/hadith-topics.py
      - run: |
          bash tools/git-save.sh "قسم الحديث: كتب السنة" data/hadith/k data/hadith/topics
