name: كتب السنة في قسم الحديث
on:
  workflow_dispatch:
  push:
    branches: [main]  # فرع وكيل لا يشغّل مهام الحفظ (كانت تدفع إيداعات الفرع إلى main)
    paths: ["tools/kutub.py", "tools/hadith-topics.py", "tools/hadith-links.py", "tools/hadith-rev.py", "tools/hadith-grades.py"]
  # الكتب المستوردة حديثًا (صحيح ابن خزيمة وابن حبان والمستدرك والمصنفات والمعاجم…) تدخل القسم آليًا بعد استيرادها
  workflow_run:
    workflows: ["استيراد كتب التراث من OpenITI", "استيراد كتب التراث المشكولة من الشاملة"]
    types: [completed]
  schedule:
    - cron: "17 5 * * 1"  # أسبوعيًا احتياطًا
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/kutub.py && python3 tools/hadith-topics.py && python3 tools/hadith-links.py && python3 tools/hadith-rev.py && python3 tools/hadith-grades.py
      - run: |
          bash tools/git-save.sh "قسم الحديث: كتب السنة" data/hadith/k data/hadith/topics data/hadith/links data/hadith/grades
