name: فتح روابط مشاركة فيسبوك (معرفة الصفحات)
on:
  workflow_dispatch:
  push:
    branches: [main]  # فرع وكيل لا يشغّل مهام الحفظ (كانت تدفع إيداعات الفرع إلى main)
    paths: ["data/fb-links.json"]
permissions:
  contents: write
concurrency:
  group: fb-resolve
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/fb-resolve.js
      - run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add data/fb-links.json
          git diff --cached --quiet && exit 0
          git commit -qm "روابط فيسبوك: معرفة الصفحات"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
