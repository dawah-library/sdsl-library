name: فهرس الأعلام والرواة
on:
  workflow_dispatch:
  schedule:
    - cron: "50 3 * * 0"   # أسبوعيًا: يضم كتب التراجم والرجال المستوردة حديثًا وفهارس الأعلام
  push:
    paths: ["tools/alam.py"]
  workflow_run:
    workflows: ["استيراد كتب التراث من OpenITI", "الفهارس الفنية (الآيات والأحاديث والأعلام)"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: alam
  cancel-in-progress: false
jobs:
  # مفتاح الإيقاف من «الإدارة ← الخدمات والمفاتيح» (data/switches.json). الإيقاف يشمل التشغيل اليدوي والآلي؛ وتعذر القراءة لا يوقف المهمة.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" alam)
          echo "on=$on" >> "$GITHUB_OUTPUT"; echo "المفتاح alam: $on"
  build:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/alam.py
      - run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add -A data/alam tools/alam-report.md
          git diff --cached --quiet && exit 0
          git commit -qm "فهرس الأعلام والرواة: تحديث"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
