name: كشف النقص في الكتب المحوّلة
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "معرّفات الكتب (فارغ = كتب الدعوة المحوّلة)"
        required: false
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: ocr-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils
          sudo curl -sSL -o /usr/share/tesseract-ocr/5/tessdata/ara.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ara.traineddata || true
          tesseract --list-langs | head
      - run: OMP_THREAD_LIMIT=1 python3 tools/ocr-audit.py ${{ github.event.inputs.ids }}
      - run: bash tools/git-save.sh "كشف النقص في الكتب المحوّلة" data/audit data/books data/catalog.json
      - if: always()
        run: '[ -s .audit-report.txt ] && python3 tools/notify.py "$(cat .audit-report.txt)" || true'
