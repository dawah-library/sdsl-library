name: تمارين الطلائع (إجابات مقترحة من الدروس)
on:
  workflow_dispatch:
    inputs:
      n: { description: "عدد الأسئلة في الجولة", required: false, default: "400" }
  # الجدولة موقوفة مؤقتًا (٧ نوفمبر، قرار المدير: المفاتيح لتجهيز الكتب). لإعادتها:
  # schedule:
  #   - cron: "37 22 * * 2,5"
permissions:
  contents: write
concurrency:
  group: tala-ex
  cancel-in-progress: false
jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: أولوية المفاتيح لتصحيح الكتب المرفوعة
        id: pri
        run: |
          pp=$(python3 -c 'import json;print(int(json.load(open("data/progress.json")).get("pending_pages") or 0))' 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${pp:-0}" -gt 400 ]; then echo "skip=1" >> $GITHUB_OUTPUT; echo "تأجيل: ${pp} صفحة تنتظر التصحيح"; fi
      - name: اقتراح الإجابات
        if: ${{ steps.pri.outputs.skip != '1' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
          GEMINI_API_KEY_7: ${{ secrets.GEMINI_API_KEY_7 }}
          GEMINI_API_KEY_8: ${{ secrets.GEMINI_API_KEY_8 }}
          GEMINI_API_KEY_9: ${{ secrets.GEMINI_API_KEY_9 }}
          GEMINI_API_KEY_10: ${{ secrets.GEMINI_API_KEY_10 }}
          GEMINI_API_KEY_11: ${{ secrets.GEMINI_API_KEY_11 }}
          GEMINI_API_KEY_12: ${{ secrets.GEMINI_API_KEY_12 }}
          GEMINI_API_KEY_13: ${{ secrets.GEMINI_API_KEY_13 }}
          GEMINI_API_KEY_14: ${{ secrets.GEMINI_API_KEY_14 }}
          GEMINI_API_KEY_15: ${{ secrets.GEMINI_API_KEY_15 }}
          GEMINI_API_KEY_16: ${{ secrets.GEMINI_API_KEY_16 }}
          GEMINI_API_KEY_17: ${{ secrets.GEMINI_API_KEY_17 }}
          GEMINI_API_KEY_18: ${{ secrets.GEMINI_API_KEY_18 }}
          GEMINI_API_KEY_19: ${{ secrets.GEMINI_API_KEY_19 }}
          GEMINI_API_KEY_20: ${{ secrets.GEMINI_API_KEY_20 }}
        run: python3 tools/tala-ex.py --answer ${{ github.event.inputs.n || '400' }}
      - run: |
          bash tools/git-save.sh "تمارين الطلائع: إجابات مقترحة من الدروس (تنتظر الاعتماد)" data/tala-ex.json
