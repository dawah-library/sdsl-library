name: استيراد كتب التراث المشكولة من الشاملة
# مهمة متدرجة غير عاجلة: كتاب واحد كل ليلة، بطلبات قليلة، وتتنحى إذا كان تحويل كتب المشايخ يعمل
on:
  workflow_dispatch:
    inputs:
      queue:
        description: "الطابور: data/turathio-queue.json (التراث المشكول) أو data/adab-queue.json (كتب الأدباء والعلماء ومقالاتهم)"
        required: false
        default: "data/turathio-queue.json"
      max:
        description: "أقصى عدد كتب في التشغيل"
        required: false
        default: ""
  schedule:
    - cron: "23 23 * * *"
    - cron: "47 4 * * *"    # كتب الأدباء والعلماء ومقالاتهم (data/adab-queue.json)
    - cron: "47 15 * * *"   # جولة ثانية للطابور نفسه
permissions:
  contents: write
  id-token: write
  actions: read
concurrency:
  group: turathio-batch
  cancel-in-progress: false
jobs:
  # مفتاح الإيقاف من «الإدارة ← الخدمات والمفاتيح» (data/switches.json). الإيقاف يشمل التشغيل اليدوي والآلي؛ وتعذر القراءة لا يوقف المهمة.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" import_turath)
          echo "on=$on" >> "$GITHUB_OUTPUT"; echo "المفتاح import_turath: $on"
  batch:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - name: استرجاع ما جُلب سابقًا
        uses: actions/cache/restore@v4
        with:
          path: .tio-cache
          key: tiob-${{ github.run_id }}
          restore-keys: tiob-
      - name: التنحي لتحويل كتب المشايخ
        id: yield
        if: ${{ !(github.event.inputs.queue == 'data/adab-queue.json' || github.event.schedule == '47 4 * * *' || github.event.schedule == '47 15 * * *') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R ${{ github.repository }} -w ocr.yml -s in_progress --json databaseId -q length 2>/dev/null || echo 0)
          q=$(gh run list -R ${{ github.repository }} -w ocr.yml -s queued --json databaseId -q length 2>/dev/null || echo 0)
          if [ "$((n+q))" -gt 0 ]; then echo "التحويل يعمل؛ يؤجَّل الاستيراد"; echo "skip=1" >> $GITHUB_OUTPUT; fi
      - name: البحث والاستيراد
        if: ${{ steps.yield.outputs.skip != '1' }}
        env:
          TIO_MINUTES: "170"
          TIO_CONC: "3"
          TIO_QUEUE: ${{ github.event.inputs.queue || ((github.event.schedule == '47 4 * * *' || github.event.schedule == '47 15 * * *') && 'data/adab-queue.json' || 'data/turathio-queue.json') }}
          TIO_MAX_BOOKS: ${{ github.event.inputs.max || ((github.event.inputs.queue == 'data/adab-queue.json' || github.event.schedule == '47 4 * * *' || github.event.schedule == '47 15 * * *') && '8' || '2') }}
        run: python3 tools/turathio-batch.py
      - name: حفظ ما جُلب للاستئناف
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .tio-cache
          key: tiob-${{ github.run_id }}
      - name: فهرس معاني الكلمات
        if: ${{ hashFiles('.tio-incomplete') == '' }}
        run: python3 tools/gloss.py >/dev/null && bash tools/git-save.sh "فهرس معاني الكلمات بعد استيراد التراث المشكول" data/gloss || true
      - name: مفردات القرآن من كتب الغريب
        run: |
          python3 tools/gharib.py --no-roots && bash tools/git-save.sh "المصحف: معاني المفردات من كتب الغريب" data/quran/lex || true
      - name: إشعار
        if: always()
        run: '[ -s .tio-batch-report.txt ] && python3 tools/notify.py "$(cat .tio-batch-report.txt)" || true'
