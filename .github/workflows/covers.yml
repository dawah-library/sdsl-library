name: أغلفة الكتب المصغرة
on:
  workflow_dispatch:
    inputs:
      books: { description: "معرّفات كتب (اختياري)", required: false, default: "" }
      force: { description: "إعادة رسم الموجود (1/0)", required: false, default: "0" }
  schedule:
    - cron: "17 4 * * 1"   # أسبوعيًا: أغلفة الكتب المصورة الجديدة
  push:
    paths: ["tools/covers.py", "data/covers.json"]
permissions:
  contents: write
  id-token: write
concurrency:
  group: covers
  cancel-in-progress: false
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils >/dev/null && pip install -q pillow
      - name: رسم الأغلفة
        env:
          COVERS_ONLY: ${{ github.event.inputs.books }}
          COVERS_FORCE: ${{ github.event.inputs.force || '0' }}
        run: python3 tools/covers.py
      - run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add assets/covers data/covers.json tools/covers-report.md
          git diff --cached --quiet && exit 0
          git commit -qm "أغلفة الكتب المصغرة"
          ok=0; for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && ok=1 && break; sleep 5; done; [ $ok = 1 ]
