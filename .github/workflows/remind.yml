name: تذكير القراء بوردهم وإرسال الإشعارات
on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
concurrency:
  group: remind
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: استدعاء خدمة التذكير
        run: curl -sS --max-time 120 https://dawahlibrary.org/api/remind || true
