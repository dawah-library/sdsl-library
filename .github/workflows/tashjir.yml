name: تشجير الكتب (للكتب التي تختارها الإدارة)
on:
  push:
    paths: ["data/tashjir/_queue.json"]
  workflow_dispatch:
    inputs:
      books:
        description: "معرّفات كتب (اختياري)"
        required: false
        default: ""
permissions:
  contents: write
  id-token: write
concurrency:
  group: tashjir
  cancel-in-progress: false
jobs:
  # مفتاح الإيقاف من «الإدارة ← الخدمات والمفاتيح» (data/switches.json). الإيقاف يشمل التشغيل اليدوي والآلي؛ وتعذر القراءة لا يوقف المهمة.
  gate:
    runs-on: ubuntu-latest
    outputs:
      on: ${{ steps.s.outputs.on }}
    steps:
      - id: s
        run: |
          j=$(curl -sf --max-time 15 "https://raw.githubusercontent.com/${{ github.repository }}/main/data/switches.json" || echo '{}')
          on=$(python3 -c 'import json,sys
          try: s=(json.loads(sys.argv[1]) or {}).get("s") or {}
          except Exception: s={}
          print("false" if s.get("all_jobs") is False or s.get(sys.argv[2]) is False else "true")' "$j" tashjir)
          echo "on=$on" >> "$GITHUB_OUTPUT"; echo "المفتاح tashjir: $on"
  build:
    needs: gate
    if: ${{ needs.gate.outputs.on == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: التشجير
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          TJ_ONLY: ${{ github.event.inputs.books }}
        run: python3 tools/tashjir.py
      - name: الحفظ
        if: always()
        run: |
          git config user.name "sdsl-bot"
          git config user.email "sdsl-bot@users.noreply.github.com"
          git add data/tashjir
          git diff --cached --quiet && exit 0
          git commit -qm "تشجير الكتب: تحديث"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break; sleep 5; done
      - name: إشعار
        if: always()
        run: '[ -s .tj-report.txt ] && python3 tools/notify.py "$(cat .tj-report.txt)" || true'
